# Quarto website — only these sources are rendered (see `project.render`).
# https://quarto.org/docs/websites/

# =========================
# Project scope and build
# =========================
project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - ubuntu.qmd
    - software.qmd
    - network.qmd
    - onedrive.qmd
    - r.qmd
    - git.qmd
    - latex.qmd

# =========================
# Website metadata and navigation
# =========================
website:
  title: "Team teaching material"
  description: "Teaching resources (Linux installation guide and more)."
  site-url: https://bastienchassagnol.github.io/ubuntu-genesis/
  repo-url: https://github.com/bastienchassagnol/ubuntu-genesis
  repo-branch: main
  repo-actions: [edit, issue, source]
  open-graph: true
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - href: ubuntu.qmd
        text: Ubuntu
      - href: software.qmd
        text: Software
      - href: network.qmd
        text: Network
      - href: onedrive.qmd
        text: OneDrive
      - href: r.qmd
        text: R
      - href: git.qmd
        text: Git
      - href: latex.qmd
        text: LaTeX
    right:
      - icon: github
        href: https://github.com/bastienchassagnol/ubuntu-genesis
        aria-label: GitHub
  sidebar: false
  page-footer:
    center:  |
       Written by Bastien CHASSAGNOL and Benjamin LOIRE, with suggestions from Marielle, Kenza, Morgane and Philippe. This website is built with <a href="https://quarto.org/">Quarto</a>.
    background: "#f8f9fa"
    border: false
    right:
      - icon: github
        href: https://github.com/bastienchassagnol/ubuntu-genesis
      - icon: linkedin
        href: https://www.linkedin.com/company/marseille-medical-genetics/posts/?feedView=all

author: "Bastien Chassagnol, Benjamin Loire, Morgane, Philippe, Marielle"

# =========================
# Shared document defaults
# =========================
quarto-required: ">= 1.8.0"
toc: true
toc-depth: 4
number-sections: true # Required for cross-referencing sections
number-depth: 4
tbl-cap-location: bottom
fig-align: center
out-width: "80%"
fig-dpi: 320

# =========================
# Output formats
# =========================
format:
  html:
    # Presentation choices for the web version
    page-layout: full
    lightbox: true
    smooth-scroll: true
    comments:
      hypothesis: true # Optional third-party annotation layer
    code-fold: true
    code-tools: true
    code-summary: "Show the code"
    code-link: false
    code-overflow: wrap
    code-copy: hover
    crossrefs-hover: true
    footnotes-hover: true
    citations-hover: true
    include-in-header:
      - file: github-corner.html

# =========================
# Filters and execution
# =========================
# filters:
#   - highlight-text

# Markdown-only chapters: do not select the knitr engine (that requires Rscript).
engine: markdown
execute:
  echo: false
  eval: true
  message: false
  warning: false
  error: false
  # Re-execute only when a source file changes
  # https://quarto.org/docs/projects/code-execution.html#freeze
  freeze: auto

#### Code and knitr formatting ####
knitr:
  opts_chunk:
    collapse: true # keep code and outputs together
    comment: "#>" # tidyverse style for code outputs
    R.options: # default table rendering
      dplyr.print_min: 6
      dplyr.print_max: 6
      pillar.max_footer_lines: 2
      pillar.min_chars: 15
      pillar.bold: TRUE

# =========================
# Editor preferences
# =========================
editor:
  source: true

# =========================
# Metadata
# =========================
license: "MIT"
copyright:
  holder: Bastien C., Morgane C., Marielle P., Philippe D.
lang: en-GB
subject: "Linux tutorial"
citation: true # Returns with the URL of the website
google-scholar: true

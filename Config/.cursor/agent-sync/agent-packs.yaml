# Vendored agent packs (bundle root: ../rules and ../skills).
# agent-sync.sh reads this file with simple grep/sed — keep the layout stable.

never_sync_skills:
  - firecrawl

packs:
  user-global:
    description: Full teaching bundle rules and vendored skills
    rules: all
    skills: all
  quarto-only:
    description: Quarto website and slides
    rules:
      - r-python-project.mdc
      - code-intelligence.mdc
      - documentation-bibliography.mdc
      - quarto-presentations.mdc
      - scientific-writing.mdc
      - token-budget.mdc
      - figure-sources.mdc
    skills:
      - quarto-revealjs
      - quarto-website
      - quarto-book
      - data-visualisation
      - codegraph
      - graphify
  r-stats-only:
    description: R, statistics, and figures
    rules:
      - r-python-project.mdc
      - code-intelligence.mdc
      - r-development.mdc
      - r-package-development.mdc
      - statistical-modelling.mdc
      - data-visualisation.mdc
      - scientific-writing.mdc
      - token-budget.mdc
    skills:
      - data-visualisation
      - deslop
      - codegraph
      - graphify
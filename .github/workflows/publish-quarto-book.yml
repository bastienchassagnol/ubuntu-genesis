# Render Quarto to ./docs, then `quarto publish gh-pages` pushes that HTML
# to the gh-pages branch. GitHub Pages serves that branch (root), not ./docs
# on main. The gh-pages branch must already exist; `quarto publish` does not
# create it from Actions.
#
# Settings → Pages → Source: Deploy from a branch → gh-pages → / (root).

name: Quarto Publish Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 17 * * 5"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Markdown-only site: no R/downlit. `freeze: auto` reuses `_freeze/`
      # when sources are unchanged (https://quarto.org/docs/projects/code-execution.html#freeze).
      - name: Render website (HTML)
        run: quarto render

      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
